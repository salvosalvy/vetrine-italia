<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TarantoServizi - Portale Utilità Territoriale</title>
  
  <!-- Favicon integrata -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40 border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
        <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md font-black text-xl flex items-center justify-center w-10 h-10">
          <i class="fa-solid fa-landmark"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight leading-none">TarantoServizi</h1>
          <p class="text-xs text-slate-400 mt-0.5 font-medium">PROVINCIA DI TARANTO</p>
        </div>
      </div>
    </div>
  </header>

  <!-- HERO & FILTRI -->
  <section class="bg-slate-900 text-white py-10 px-4 shadow-inner">
    <div class="max-w-4xl mx-auto text-center space-y-4">
      <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight">Cosa stai cercando in Provincia?</h2>
      <p class="text-slate-400 text-sm md:text-base">Seleziona sia il Comune che la Categoria per visualizzare i servizi relativi.</p>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 max-w-2xl mx-auto text-left">
        
        <!-- 1. SELEZIONA COMUNE -->
        <div>
          <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">1. Seleziona Comune</label>
          <select id="select-comune" onchange="caricaRisorse()" class="w-full p-3 rounded-lg border border-slate-700 bg-slate-800 text-white shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">-- Scegli un Comune --</option>
            <option value="Avetrana">Avetrana</option>
            <option value="Carosino">Carosino</option>
            <option value="Castellaneta">Castellaneta</option>
            <option value="Crispiano">Crispiano</option>
            <option value="Faggiano">Faggiano</option>
            <option value="Fragagnano">Fragagnano</option>
            <option value="Ginosa">Ginosa</option>
            <option value="Grottaglie">Grottaglie</option>
            <option value="Laterza">Laterza</option>
            <option value="Leporano">Leporano</option>
            <option value="Lizzano">Lizzano</option>
            <option value="Manduria">Manduria</option>
            <option value="Martina Franca">Martina Franca</option>
            <option value="Maruggio">Maruggio</option>
            <option value="Massafra">Massafra</option>
            <option value="Monteiasi">Monteiasi</option>
            <option value="Montemesola">Montemesola</option>
            <option value="Monteparano">Monteparano</option>
            <option value="Mottola">Mottola</option>
            <option value="Palagianello">Palagianello</option>
            <option value="Palagiano">Palagiano</option>
            <option value="Pulsano">Pulsano</option>
            <option value="Roccaforzata">Roccaforzata</option>
            <option value="San Giorgio Ionico">San Giorgio Ionico</option>
            <option value="San Marzano di San Giuseppe">San Marzano di San Giuseppe</option>
            <option value="Sava">Sava</option>
            <option value="Statte">Statte</option>
            <option value="Taranto">Taranto</option>
            <option value="Torricella">Torricella</option>
          </select>
        </div>

        <!-- 2. SELEZIONA CATEGORIA -->
        <div>
          <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">2. Seleziona Categoria</label>
          <select id="select-categoria" onchange="caricaRisorse()" class="w-full p-3 rounded-lg border border-slate-700 bg-slate-800 text-white shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">-- Scegli una Categoria --</option>
            <option value="Pronto intervento">🚨 Pronto Intervento</option>
            <option value="Farmacie">💊 Farmacie</option>
            <option value="Servizi Sanitari">🏥 Servizi Sanitari</option>
            <option value="Medici Specialisti">🩺 Medici Specialisti</option>
            <option value="Servizi">🏛️ Servizi ed Enti Pubblici</option>
            <option value="Uffici Postali">🏣 Uffici Postali</option>
            <option value="Banche">🏦 Banche</option>
            <option value="Servizio Spedizioni">📦 Servizio Spedizioni</option>
            <option value="Auto e Meccanici">🚗 Auto e Meccanici</option>
            <option value="Veterinari">🩺 Veterinari</option>
            <option value="Animali e Pet Care">🐾 Animali e Pet Care</option>
            <option value="Mangiare">🍽️ Mangiare</option>
            <option value="Hotel e B&B">🏨 Hotel e B&B</option>
            <option value="Servizi Catering">🍱 Servizi Catering</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Onoranze Funebri">🕊️ Onoranze Funebri</option>
            <option value="Sport">⚽ Sport</option>
            <option value="Luoghi di Culto">⛪ Luoghi di Culto</option>
            <option value="Teatri">🎭 Teatri</option>
            <option value="Cinema">🎬 Cinema</option>
            <option value="Dance">🪩 Dance</option>
          </select>
        </div>

      </div>
    </div>
  </section>

  <!-- RISULTATI -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    <div id="risultati" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-center text-slate-500 col-span-full py-12">Seleziona sia un <strong>Comune</strong> che una <strong>Categoria</strong> per visualizzare i servizi.</p>
    </div>
  </main>

  <!-- SCRIPT SUPABASE -->
  <script>
    const SUPABASE_URL = 'https://jqlkeaomrkvafdaxusvm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxbGtlYW9tcmt2YWZkYXh1c3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzc5NDUsImV4cCI6MjEwMjcxMzk0NX0.l0t0Kta0W8NVJfJ7Pltwi_cAxUWNvb8eTsz66Q0Q90w';

    let supabaseClient;

    // MAPPA DEGLI STILI PASTELLO PER CATEGORIA
    function getStileCategoria(cat) {
      const stili = {
        'Pronto intervento':    { cardBg: 'bg-red-50/70',     border: 'border-red-200/80',     badge: 'bg-red-100 text-red-800' },
        'Farmacie':            { cardBg: 'bg-emerald-50/70', border: 'border-emerald-200/80', badge: 'bg-emerald-100 text-emerald-800' },
        'Servizi Sanitari':    { cardBg: 'bg-teal-50/70',    border: 'border-teal-200/80',    badge: 'bg-teal-100 text-teal-800' },
        'Medici Specialisti':  { cardBg: 'bg-cyan-50/70',    border: 'border-cyan-200/80',    badge: 'bg-cyan-100 text-cyan-800' },
        'Servizi':             { cardBg: 'bg-blue-50/70',    border: 'border-blue-200/80',    badge: 'bg-blue-100 text-blue-800' },
        'Uffici Postali':      { cardBg: 'bg-yellow-50/70',  border: 'border-yellow-200/80',  badge: 'bg-yellow-100 text-yellow-800' },
        'Banche':              { cardBg: 'bg-indigo-50/70',  border: 'border-indigo-200/80',  badge: 'bg-indigo-100 text-indigo-800' },
        'Servizio Spedizioni': { cardBg: 'bg-orange-50/70',  border: 'border-orange-200/80',  badge: 'bg-orange-100 text-orange-800' },
        'Auto e Meccanici':   { cardBg: 'bg-slate-100/70',   border: 'border-slate-300/80',   badge: 'bg-slate-200 text-slate-800' },
        'Veterinari':          { cardBg: 'bg-lime-50/70',     border: 'border-lime-200/80',    badge: 'bg-lime-100 text-lime-800' },
        'Animali e Pet Care':  { cardBg: 'bg-green-50/70',    border: 'border-green-200/80',   badge: 'bg-green-100 text-green-800' },
        'Mangiare':            { cardBg: 'bg-amber-50/70',    border: 'border-amber-200/80',   badge: 'bg-amber-100 text-amber-800' },
        'Hotel e B&B':         { cardBg: 'bg-purple-50/70',   border: 'border-purple-200/80',  badge: 'bg-purple-100 text-purple-800' },
        'Servizi Catering':    { cardBg: 'bg-yellow-100/50', border: 'border-yellow-300/80',  badge: 'bg-yellow-200 text-yellow-900' },
        'Shopping':            { cardBg: 'bg-pink-50/70',     border: 'border-pink-200/80',    badge: 'bg-pink-100 text-pink-800' },
        'Onoranze Funebri':    { cardBg: 'bg-stone-100/70',   border: 'border-stone-300/80',   badge: 'bg-stone-200 text-stone-800' },
        'Sport':               { cardBg: 'bg-sky-50/70',      border: 'border-sky-200/80',     badge: 'bg-sky-100 text-sky-800' },
        'Luoghi di Culto':     { cardBg: 'bg-amber-50/50',    border: 'border-amber-200/60',   badge: 'bg-amber-100 text-amber-800' },
        'Teatri':              { cardBg: 'bg-fuchsia-50/70',  border: 'border-fuchsia-200/80', badge: 'bg-fuchsia-100 text-fuchsia-800' },
        'Cinema':              { cardBg: 'bg-violet-50/70',   border: 'border-violet-200/80',  badge: 'bg-violet-100 text-violet-800' },
        'Dance':               { cardBg: 'bg-rose-50/70',     border: 'border-rose-200/80',    badge: 'bg-rose-100 text-rose-800' }
      };

      return stili[cat] || { cardBg: 'bg-white', border: 'border-slate-200', badge: 'bg-blue-50 text-blue-700' };
    }

    document.addEventListener('DOMContentLoaded', async () => {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      await caricaRisorse();
    });

    async function caricaRisorse() {
      const risultatiDiv = document.getElementById('risultati');
      const comune = document.getElementById('select-comune').value;
      const categoria = document.getElementById('select-categoria').value;

      if (!comune || !categoria) {
        risultatiDiv.innerHTML = `<p class="text-center text-slate-500 col-span-full py-12">Seleziona sia un <strong>Comune</strong> che una <strong>Categoria</strong> per visualizzare i servizi.</p>`;
        return;
      }

      const { data: risorse, error } = await supabaseClient
        .from('risorse_locali')
        .select('*')
        .eq('comune', comune)
        .eq('categoria', categoria)
        .order('nome', { ascending: true });

      if (error) {
        console.error('Errore Supabase:', error);
        risultatiDiv.innerHTML = `<p class="text-center text-red-500 col-span-full py-12">Errore nel caricamento: ${error.message}</p>`;
        return;
      }

      if (!risorse || risorse.length === 0) {
        risultatiDiv.innerHTML = `<p class="text-center text-slate-500 col-span-full py-12">Nessun servizio trovato per <strong>${comune}</strong> nella categoria <strong>${categoria}</strong>.</p>`;
        return;
      }

      risultatiDiv.innerHTML = risorse.map(r => {
        // Recupera gli stili pastello specifici per questa categoria
        const stile = getStileCategoria(r.categoria);

        // Genera il link a Google Maps
        const queryMappa = encodeURIComponent(`${r.nome}, ${r.indirizzo || ''}, ${r.comune} TA`);
        const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${queryMappa}`;

        return `
          <div class="${stile.cardBg} ${stile.border} rounded-xl shadow-sm border p-5 hover:shadow-md transition flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${stile.badge} uppercase tracking-wider">${r.categoria}</span>
                <span class="text-xs text-slate-500 font-medium"><i class="fa-solid fa-city mr-1"></i>${r.comune}</span>
              </div>

              <h3 class="text-lg font-bold text-slate-900 mt-1">${r.nome}</h3>
              
              <!-- INDIRIZZO CON ICONA POSIZIONE ROSSA -->
              <div class="text-sm text-slate-700 mt-3 flex items-start gap-2">
                <i class="fa-solid fa-location-dot text-red-500 text-lg mt-0.5 shrink-0"></i>
                <span class="font-medium">${r.indirizzo || 'Indirizzo non specificato'}</span>
              </div>
            </div>

            <!-- PULSANTI AZIONE -->
            <div class="mt-4 pt-3 border-t border-slate-900/10 flex items-center justify-between gap-2">
              ${r.telefono ? `
                <a href="tel:${r.telefono.replace(/\s+/g, '')}" class="text-xs font-semibold text-blue-700 bg-white/80 hover:bg-white border border-blue-200 px-3 py-2 rounded-lg transition inline-flex items-center gap-1.5 shadow-sm">
                  <i class="fa-solid fa-phone text-blue-600"></i> ${r.telefono}
                </a>` : '<div></div>'}
              
              <!-- BOTTONE POSIZIONE MAPPA -->
              <a href="${googleMapsUrl}" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold text-slate-800 bg-white/80 hover:bg-white border border-slate-300 px-3 py-2 rounded-lg transition inline-flex items-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-map-location-dot text-red-500"></i> Mappa
              </a>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
