<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TarantoServizi - Portale Utilità Territoriale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40 border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
        <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md font-black text-xl flex items-center justify-center w-10 h-10">
          <i class="fa-solid fa-landmark"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight leading-none">TarantoServizi</h1>
          <p class="text-xs text-slate-400 mt-0.5 font-medium">PROVINCIA DI TARANTO</p>
        </div>
      </div>
    </div>
  </header>

  <!-- HERO & DOPPIO FILTRO -->
  <section class="bg-slate-900 text-white py-10 px-4 shadow-inner">
    <div class="max-w-4xl mx-auto text-center space-y-4">
      <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight">Cosa stai cercando in Provincia?</h2>
      <p class="text-slate-400 text-sm md:text-base">Filtra per Comune e Categoria per trovare rapidamente quello di cui hai bisogno.</p>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 max-w-2xl mx-auto text-left">
        <div>
          <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">1. Seleziona Comune</label>
          <select id="select-comune" onchange="caricaRisorse()" class="w-full p-3 rounded-lg border border-slate-700 bg-slate-800 text-white shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">Tutti i Comuni</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">2. Seleziona Categoria</label>
          <select id="select-categoria" onchange="caricaRisorse()" class="w-full p-3 rounded-lg border border-slate-700 bg-slate-800 text-white shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">Tutte le Categorie</option>
            <option value="Pronto Intervento">🚨 Pronto Intervento</option>
            <option value="Servizi">🏛️ Servizi</option>
            <option value="Luoghi di Culto">⛪ Luoghi di Culto</option>
            <option value="Mangiare">🍽️ Mangiare</option>
            <option value="Sport">⚽ Sport</option>
            <option value="Shopping">🛍️ Shopping</option>
            <option value="Teatri">🎭 Teatri</option>
            <option value="Cinema">🎬 Cinema</option>
            <option value="Dance">🪩 Dance</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <!-- RISULTATI -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    <div id="risultati" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-center text-slate-500 col-span-full py-12">Caricamento in corso...</p>
    </div>
  </main>

  <!-- SCRIPT SUPABASE -->
  <script>
    const SUPABASE_URL = 'https://jqlkeaomrkvafdaxusvm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxbGtlYW9tcmt2YWZkYXh1c3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzc5NDUsImV4cCI6MjEwMjcxMzk0NX0.l0t0Kta0W8NVJfJ7Pltwi_cAxUWNvb8eTsz66Q0Q90w';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let comuniMappa = {};

    document.addEventListener('DOMContentLoaded', async () => {
      await caricaComuni();
      await caricaRisorse();
    });

    async function caricaComuni() {
      const { data: comuni } = await supabaseClient.from('comuni').select('*').order('nome');
      const selectComune = document.getElementById('select-comune');
      if (comuni && comuni.length > 0) {
        selectComune.innerHTML = '<option value="">Tutti i Comuni</option>';
        comuni.forEach(c => {
          comuniMappa[c.id] = c.nome;
          selectComune.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
        });
      }
    }

    async function caricaRisorse() {
      const risultatiDiv = document.getElementById('risultati');
      const comuneId = document.getElementById('select-comune').value;
      const categoria = document.getElementById('select-categoria').value;

      let query = supabaseClient.from('risorse_locali').select('*');
      if (comuneId && comuneId !== "") query = query.eq('comune_id', Number(comuneId));
      if (categoria && categoria !== "") query = query.eq('categoria', categoria);

      const { data: risorse, error } = await query;

      if (error || !risorse || risorse.length === 0) {
        risultatiDiv.innerHTML = `<p class="text-center text-slate-500 col-span-full py-12">Nessun servizio trovato con i filtri selezionati.</p>`;
        return;
      }

      risultatiDiv.innerHTML = risorse.map(r => `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 hover:shadow-md transition flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between gap-2 mb-2">
              <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 uppercase tracking-wider">${r.categoria}</span>
              <span class="text-xs text-slate-400 font-medium"><i class="fa-solid fa-city mr-1"></i>${comuniMappa[r.comune_id] || ''}</span>
            </div>
            <h3 class="text-lg font-bold text-slate-800 mt-1">${r.nome}</h3>
            <p class="text-sm text-slate-600 mt-2"><i class="fa-solid fa-location-dot text-slate-400 mr-1.5"></i>${r.indirizzo || 'Indirizzo non specificato'}</p>
          </div>
          ${r.telefono ? `<p class="text-sm text-slate-600 mt-3 pt-3 border-t border-slate-100"><i class="fa-solid fa-phone text-slate-400 mr-1.5"></i>${r.telefono}</p>` : ''}
        </div>
      `).join('');
    }
  </script>
</body>
</html>
