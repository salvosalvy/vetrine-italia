<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portale Servizi Territoriali d'Italia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40 border-b border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
        <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md font-black text-xl flex items-center justify-center w-10 h-10">
          <i class="fa-solid fa-landmark"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight leading-none">ItaliaServizi</h1>
          <p class="text-xs text-slate-400 mt-0.5 font-medium">PORTALE NAZIONALE UTILITÀ</p>
        </div>
      </div>
    </div>
  </header>

  <!-- HERO & FILTRI CASCATA -->
  <section class="bg-slate-900 text-white py-12 px-4 shadow-inner">
    <div class="max-w-4xl mx-auto text-center space-y-4">
      <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight">Trova Servizi, Emergenze e Luoghi di Culto</h2>
      <p class="text-slate-400 text-sm md:text-base">Seleziona regione, provincia e comune per filtrare le informazioni del tuo territorio.</p>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-4 text-left">
        <div>
          <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">1. Regione</label>
          <select id="select-regione" onchange="gestisciCambioRegione()" class="w-full p-3 rounded-lg border border-slate-700 bg-slate-800 text-white shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">Tutte le Regioni</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">2. Provincia</label>
          <select id="select-provincia" onchange="gestisciCambioProvincia()" disabled class="w-full p-3 rounded-lg border border-slate-700 bg-slate-800 text-white shadow-sm focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed outline-none">
            <option value="">Tutte le Province</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1 font-semibold uppercase">3. Comune</label>
          <select id="select-comune" onchange="caricaRisorse()" disabled class="w-full p-3 rounded-lg border border-slate-700 bg-slate-800 text-white shadow-sm focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed outline-none">
            <option value="">Tutti i Comuni</option>
          </select>
        </div>
      </div>
    </div>
  </section>

  <!-- CONTENUTO PRINCIPALE -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    <div id="risultati" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <p class="text-center text-slate-500 col-span-full py-12">Caricamento in corso...</p>
    </div>
  </main>

  <!-- SCRIPT SUPABASE -->
  <script>
    const SUPABASE_URL = 'https://jqlkeaomrkvafdaxusvm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxbGtlYW9tcmt2YWZkYXh1c3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzc5NDUsImV4cCI6MjEwMjcxMzk0NX0.l0t0Kta0W8NVJfJ7Pltwi_cAxUWNvb8eTsz66Q0Q90w'; // Sostituisci se necessario
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener('DOMContentLoaded', async () => {
      // Inserisci la tua publishable key se la costante sopra fosse un segnaposto
      await caricaRegioni();
      await caricaRisorse();
    });

    async function gestisciCambioRegione() {
  const regioneId = document.getElementById('select-regione').value;
  const selectProvincia = document.getElementById('select-provincia');
  const selectComune = document.getElementById('select-comune');

  selectProvincia.innerHTML = '<option value="">Tutte le Province</option>';
  selectComune.innerHTML = '<option value="">Tutti i Comuni</option>';
  selectComune.disabled = true;

  if (!regioneId) {
    selectProvincia.disabled = true;
    caricaRisorse();
    return;
  }

  // Carica le province collegate
  const { data: province, error } = await supabaseClient
    .from('province')
    .select('*')
    .eq('regione_id', regioneId)
    .order('nome');

  if (province && province.length > 0) {
    province.forEach(p => {
      selectProvincia.innerHTML += `<option value="${p.id}">${p.nome}</option>`;
    });
    selectProvincia.disabled = false;
  } else {
    selectProvincia.disabled = true;
  }
  caricaRisorse();
}

async function gestisciCambioProvincia() {
  const provinciaId = document.getElementById('select-provincia').value;
  const selectComune = document.getElementById('select-comune');

  selectComune.innerHTML = '<option value="">Tutti i Comuni</option>';

  if (!provinciaId) {
    selectComune.disabled = true;
    caricaRisorse();
    return;
  }

  // Abilitiamo il menu per permettere la selezione
  selectComune.disabled = false;

  // Carica i comuni collegati alla provincia selezionata
  const { data: comuni, error } = await supabaseClient
    .from('comuni')
    .select('*')
    .eq('provincia_id', provinciaId)
    .order('nome');

  if (comuni && comuni.length > 0) {
    comuni.forEach(c => {
      selectComune.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
    });
  } else {
    // Se non ci sono comuni specifici nel DB per questa provincia, mostra un avviso
    selectComune.innerHTML += '<option value="" disabled>Nessun comune inserito per questa provincia</option>';
  }
  caricaRisorse();
}

    async function gestisciCambioProvincia() {
      const provinciaId = document.getElementById('select-provincia').value;
      const selectComune = document.getElementById('select-comune');

      selectComune.innerHTML = '<option value="">Tutti i Comuni</option>';

      if (!provinciaId) {
        selectComune.disabled = true;
        caricaRisorse();
        return;
      }

      const { data: comuni } = await supabaseClient.from('comuni').select('*').eq('provincia_id', provinciaId).order('nome');
      if (comuni && comuni.length > 0) {
        comuni.forEach(c => {
          selectComune.innerHTML += `<option value="${c.id}">${c.nome}</option>`;
        });
        selectComune.disabled = false;
      } else {
        selectComune.disabled = true;
      }
      caricaRisorse();
    }

    async function caricaRisorse() {
      const risultatiDiv = document.getElementById('risultati');
      const comuneId = document.getElementById('select-comune').value;

      let query = supabaseClient.from('risorse_locali').select('*');
      if (comuneId) query = query.eq('comune_id', comuneId);

      const { data: risorse, error } = await query;

      if (error || !risorse || risorse.length === 0) {
        risultatiDiv.innerHTML = `<p class="text-center text-slate-500 col-span-full py-12">Nessun servizio trovato per la selezione corrente.</p>`;
        return;
      }

      risultatiDiv.innerHTML = risorse.map(r => `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 hover:shadow-md transition">
          <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 uppercase tracking-wider">${r.tipo || 'Servizio'}</span>
          <h3 class="text-lg font-bold text-slate-800 mt-3">${r.nome}</h3>
          <p class="text-sm text-slate-600 mt-1"><i class="fa-solid fa-location-dot text-slate-400 mr-1.5"></i>${r.indirizzo || 'Indirizzo non presente'}</p>
          ${r.telefono ? `<p class="text-sm text-slate-600 mt-1"><i class="fa-solid fa-phone text-slate-400 mr-1.5"></i>${r.telefono}</p>` : ''}
        </div>
      `).join('');
    }
  </script>
</body>
</html>
